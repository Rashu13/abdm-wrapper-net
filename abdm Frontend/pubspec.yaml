name: abdm_frontend
description: ABDM (Ayushman Bharat Digital Mission) M1, M2, M3 Healthcare Flutter Application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  get: ^4.6.5
  flutter_screenutil: ^5.9.0
  get_storage: ^2.1.1
  http: ^1.2.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  crypto: ^3.0.3
  pinput: ^5.0.0
  qr_flutter: ^4.1.0
  syncfusion_flutter_datagrid: ^24.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
